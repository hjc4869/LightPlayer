<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="../shared/page.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="brand">
    <img src="../icons/icon-48.png" alt="">
    <h1 data-i18n="actionTitle"></h1>
</header>

<section class="status">
    <p id="status" role="status" data-i18n="statusChecking"></p>
    <progress id="progress" max="1" value="0" hidden></progress>
    <button id="start" class="primary" type="button" hidden></button>
    <button id="pair" class="primary" type="button" data-i18n="messagePairAction" hidden></button>
</section>

<section id="takeover" class="status" hidden>
    <p data-i18n="popupArmed"></p>
    <button id="disarm" type="button" data-i18n="popupDisarm"></button>
</section>

<section id="access" class="status" hidden>
    <p data-i18n="siteAccessMissing"></p>
    <button id="grant" type="button" data-i18n="siteAccessGrant"></button>
</section>

<section>
    <h2 data-i18n="popupVideosHeader"></h2>
    <ul id="videos"></ul>
    <p id="empty" class="hint" hidden></p>
</section>

<footer>
    <button id="options" class="link" type="button" data-i18n="popupSettings"></button>
</footer>
<script src="../shared/launch.js"></script>
<script src="../shared/page.js"></script>
<script src="popup.js"></script>
</body>
</html>
