<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Light Player | Diagnostics</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #202529;
      background: #f8f9fa;
      color-scheme: light dark;
      --surface: #fff;
      --muted: #59636c;
      --line: #dce1e5;
      --accent: #006a8b;
      --good: #137049;
      --warning: #946000;
      --error: #b52d40;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #e7eaee;
        background: #181c20;
        --surface: #20262b;
        --muted: #adb7c0;
        --line: #394249;
        --accent: #4cc2ff;
        --good: #73d7ad;
        --warning: #f0c46b;
        --error: #ff8fa0;
      }
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; }
    a { color: var(--accent); text-underline-offset: 3px; }
    button, input, select { font: inherit; color: inherit; }
    button, input, select {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      padding: 7px 11px;
      max-width: 100%;
    }
    button { cursor: pointer; font-weight: 600; }
    button:hover { border-color: var(--accent); }
    button:disabled { cursor: default; opacity: .5; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    header { border-bottom: 1px solid var(--line); background: var(--surface); }
    .header-inner, main, footer { max-width: 1460px; margin: auto; padding: 24px 32px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand img { width: 40px; height: 40px; flex: none; }
    h1 { font-size: 22px; line-height: 1.3; margin: 0; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 3px; }
    .heading { display: flex; gap: 20px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
    .toolbar input { flex: 1 1 240px; min-width: 0; }
    #progress, #notice, #action-status, .note { color: var(--muted); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    #progress { min-height: 21px; margin: 12px 0 0; }
    #action-status:empty { display: none; }
    main { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 32px; align-items: start; }
    nav { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
    nav a { padding: 8px 0; font-size: 14px; overflow-wrap: anywhere; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    #results { min-width: 0; }
    section { scroll-margin-top: 20px; margin-bottom: 30px; }
    h2 { font-size: 17px; margin: 0; padding: 0 0 12px; border-bottom: 2px solid var(--line); }
    .result, .feature { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 2fr); border-bottom: 1px solid var(--line); }
    .feature p { margin: 6px 0; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .evidence { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
    .evidence a { font-size: 12px; overflow-wrap: anywhere; }
    .hdr-sample { margin: 14px 0; }
    .hdr-sample canvas { display: block; width: 100%; height: 180px; background: #000; }
    .hdr-sample-levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; gap: 4px; margin: 10px 0 5px; font-size: 12px; text-align: center; overflow-wrap: anywhere; }
    .hdr-sample-controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; }
    .hdr-sample-controls button { font-size: 12px; }
    .feature[data-state="likely"] .state { color: var(--good); }
    .feature[data-state="limited"] .state, .feature[data-state="unknown"] .state { color: var(--warning); }
    .feature[data-state="blocked"] .state { color: var(--error); }
    .result { scroll-margin-top: 20px; }
    .result:target { outline: 2px solid var(--accent); outline-offset: -2px; }
    .key, .value { min-width: 0; padding: 11px 12px; }
    .key { font-size: 13px; overflow-wrap: anywhere; font-weight: 600; }
    .value { border-left: 1px solid var(--line); }
    .state { font-size: 12px; font-weight: 600; }
    [data-state="supported"] .state { color: var(--good); }
    [data-state="unsupported"] .state, [data-state="pending"] .state { color: var(--muted); }
    [data-state="timeout"] .state { color: var(--warning); }
    [data-state="error"] .state { color: var(--error); }
    pre { font: 12px/1.6 ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    details { margin-top: 6px; }
    summary { cursor: pointer; color: var(--accent); font-size: 12px; }
    [hidden] { display: none !important; }
    footer { border-top: 1px solid var(--line); padding-top: 14px; }
    footer p { margin: 0; }
    @media (max-width: 760px) {
      .header-inner, main, footer { padding: 20px 16px; }
      main { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      nav { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px 18px; }
      nav a { padding: 4px 0; }
    }
    @media (max-width: 480px) {
      .result, .feature { grid-template-columns: minmax(0, 1fr); padding: 9px 0; }
      .key, .value { padding: 3px 0; }
      .value { border-left: 0; }
      .toolbar button { flex: 1 1 auto; }
      .toolbar input { flex-basis: 100%; }
    }
    @media print {
      .toolbar, nav, .heading select, footer { display: none; }
      main { display: block; }
      details > * { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="heading">
        <div class="brand">
          <img src="icons/icon-192.png" alt="" width="40" height="40">
          <div><h1>Light Player</h1><div class="subtitle" data-text="title">Diagnostics</div></div>
        </div>
        <select id="language" aria-label="Language"></select>
      </div>
      <div class="toolbar">
        <input id="filter" type="search" data-label="filter" autocomplete="off" spellcheck="false">
        <button id="rerun" type="button" data-text="rerun">Run again</button>
        <button id="check-audio" type="button" data-text="audio">Check audio</button>
        <button id="copy" type="button" data-text="copy">Copy JSON</button>
        <button id="download" type="button" data-text="download">Download JSON</button>
      </div>
      <p id="progress" role="status" aria-live="polite"></p>
      <pre id="action-status" role="status" aria-live="polite"></pre>
    </div>
  </header>
  <main>
    <nav id="sections" aria-label="Diagnostics"><a href="#feature-summary" data-text="featureSummary">Light Player readiness</a></nav>
    <div id="results">
      <section id="feature-summary" aria-labelledby="feature-summary-title">
        <h2 id="feature-summary-title" data-text="featureSummary">Light Player readiness</h2>
        <p class="note" data-text="summaryNote"></p>
        <div id="feature-assessments"></div>
      </section>
    </div>
  </main>
  <footer><p id="notice" data-text="notice"></p></footer>
  <noscript><p>JavaScript is required. WebAssembly is not required.</p></noscript>

          url = URL.createObjectURL(new Blob([`(${diagnosticAudioWorklet.toString()})()`], { type: "text/javascript" }));
          await deadline(context.audioWorklet.addModule(url), 1500);
          node = new AudioWorkletNode(context, "lightplayer-silent-diagnostic", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
          const output = await deadline(new Promise((resolve, reject) => {
            node.port.onmessage = event => resolve(event.data);
            node.onprocessorerror = () => reject(new Error("AudioWorklet processorerror"));
            node.connect(context.destination);
          }), 2000);
          return supported(output.quantumFrames > 0 && output.channels === 2, output);
        });
      } catch (error) {
        add("audio", "AudioContext.resume / user gesture", "error", describe(error));
      } finally {
        node?.disconnect();
        node?.port.close();
        if (url) URL.revokeObjectURL(url);
        if (context) await probe("audio", "AudioContext.close / user gesture", async () => {
          await deadline(context.close(), 1500);
          return supported(context.state === "closed");
        });
        report.audioCheckedAt = new Date().toISOString();
        audioRunning = false;
        updateProgress();
      }
    }

    function exportReport() {
      return json({ ...report, completed: !running && !audioRunning, exportedAt: new Date().toISOString(), assessments: featureAssessments(), results: Array.from(records.values(), record => record.data) });
    }

    async function run() {
      if (running || audioRunning) return;
      running = true;
      hdrSample.stop();
      report = { schemaVersion: 1, application: "Light Player", page: "diag.html", collectedAt: new Date().toISOString() };
      records.clear();
      for (const element of sections.values()) element.querySelectorAll(".result").forEach(row => row.remove());
      document.getElementById("action-status").textContent = "";
      updateProgress();
      try {
        const groups = [environmentProbes, wasmProbes, workerProbes, storageProbes, webglProbes, webgpuProbes, displayProbes, codecProbes, mediaProbes, audioProbes];
        await Promise.all(groups.map(async group => {
          try { await group(); }
          catch (error) { add("environment", group.name, "error", describe(error)); }
        }));
        await hdrSample.start();
      } catch (error) {
        add("environment", "diagnostics", "error", describe(error));
      } finally {
        report.completedAt = new Date().toISOString();
        running = false;
        updateProgress();
      }
    }

    for (const [section, name] of Object.entries(sectionNames)) {
      const element = document.createElement("section");
      element.id = section;
      const title = document.createElement("h2");
      title.textContent = text(name);
      element.append(title);
      if (["audio", "codecs", "media"].includes(section)) {
        const note = document.createElement("p");
        note.className = "note";
        note.dataset.text = section === "audio" ? "audioNote" : "codecNote";
        element.append(note);
      }
      sections.set(section, element);
      results.append(element);
      const link = document.createElement("a");
      link.href = `#${section}`;
      link.textContent = text(name);
      document.getElementById("sections").append(link);
    }

    document.getElementById("filter").addEventListener("input", filterResults);
    document.getElementById("rerun").addEventListener("click", run);
    document.getElementById("check-audio").addEventListener("click", checkAudio);
    language.addEventListener("change", () => { locale = language.value; localize(); });
    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(exportReport());
        document.getElementById("action-status").textContent = text("copied");
      } catch (error) {
        document.getElementById("action-status").textContent = json(describe(error));
      }
    });
    document.getElementById("download").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([exportReport()], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `lightplayer-diag-${report.collectedAt.replace(/[:.]/g, "-")}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    const hdrSample = createHdrSample();
    localize();
    void run();
  </script>
</body>
</html>
