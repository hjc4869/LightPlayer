app-id: im.hjc.LightPlayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
# Build-only .NET toolchain supplied by the SDK extension.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
  - org.freedesktop.Sdk.Extension.llvm22
command: lmc

# NOTE: This manifest builds and publishes the app from source *inside the sandbox*
# using the dotnet10 SDK extension. The publish is
# self-contained, so no SDK files or extra runtime module are added to /app. FFmpeg
# 8.1.x and the PulseAudio client library (libpulse.so.0) are provided by
# org.freedesktop.Platform 26.08 and resolved
# from the standard library path at runtime.
#
# NuGet restore runs offline: the build sandbox has no network, so packages are
# resolved from the local `./nuget-sources` feed and the Avalonia fork release ZIP
# fetched through `nuget-sources.json`. MSBuild verifies and extracts the ZIP before
# restore. The source list is generated by `packaging/flatpak/nuget-sources.py`.

# Expose the dotnet10 SDK extension's toolchain to every build command. Because the
# publish is self-contained, DOTNET_ROOT is intentionally NOT set and no `install.sh`
# runtime module is used.
build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin:/usr/lib/sdk/llvm22/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    DOTNET_NOLOGO: '1'

finish-args:
  # Rendering / windowing.
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Audio output (PulseAudio, including PipeWire's PulseAudio interface).
  - --socket=pulseaudio
  # Online lyrics search.
  - --share=network
  - --talk-name=com.canonical.AppMenu.Registrar
  # Holding off the screensaver while video plays.
  - --talk-name=org.freedesktop.ScreenSaver
  # Read-only access to the user's media. Files opened from elsewhere are granted
  # per-file through the document portal, so no broader filesystem access is needed.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro

modules:
  - name: lightplayer
    buildsystem: simple
    build-commands:
      # Publish the app self-contained *inside the sandbox*. Restore is offline
      # (--source ./nuget-sources -> the local feed assembled from
      # nuget-sources.json). -p:Flatpak=true selects the FFmpeg 8.1.0 bindings that
      # match the FFmpeg shipped by org.freedesktop.Platform 26.08. The
      # .NET RID and MSBuild platform follow the Flatpak build architecture, and
      # NUGET_PACKAGES / DOTNET_CLI_HOME are pinned to writable paths in the build dir.
      - |
        set -e
        case "$FLATPAK_ARCH" in
          x86_64)  DOTNET_RID=linux-x64;   DOTNET_PLATFORM=x64 ;;
          aarch64) DOTNET_RID=linux-arm64; DOTNET_PLATFORM=ARM64 ;;
          *) echo "unsupported Flatpak arch: $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        export NUGET_PACKAGES="$PWD/.nuget-packages"
        export DOTNET_CLI_HOME="$PWD/.dotnet-home"
        dotnet publish src/LightStudio.LightPlayer.Desktop/LightStudio.LightPlayer.Desktop.csproj \
          -c Release -r "$DOTNET_RID" --self-contained true \
          -p:Flatpak=true -p:Platform="$DOTNET_PLATFORM" \
          --source ./nuget-sources \
          -o publish
        # Drop files that are never used at runtime before installing into /app:
        #   * managed debug symbols (*.pdb) and the NativeAOT native symbol file (*.dbg)
        #   * per-culture satellite resource assemblies (<culture>/*.resources.dll).
        #     NativeAOT embeds the localized resources into the executable itself, so
        #     the on-disk satellites are redundant (the UI still switches language with
        #     them removed). Empty culture directories are then pruned.
        find publish \( -name '*.pdb' -o -name '*.dbg' \) -delete
        find publish -name '*.resources.dll' -delete
        find publish -mindepth 1 -type d -empty -delete
      # Install the published, self-contained app under its own prefix.
      - mkdir -p /app/lightplayer
      - cp -a publish/. /app/lightplayer/
      - chmod +x /app/lightplayer/lmc
      # Expose the launcher on PATH (/app/bin). The .NET apphost resolves its real
      # location through the symlink, so it still finds its assemblies.
      - mkdir -p /app/bin
      - ln -sf /app/lightplayer/lmc /app/bin/lmc
      # Desktop integration.
      - install -Dm644 packaging/flatpak/im.hjc.LightPlayer.desktop /app/share/applications/im.hjc.LightPlayer.desktop
      - install -Dm644 packaging/flatpak/im.hjc.LightPlayer.metainfo.xml /app/share/metainfo/im.hjc.LightPlayer.metainfo.xml
      # Register the .cue MIME type (glob + magic) so cue sheets are associated.
      - install -Dm644 packaging/flatpak/im.hjc.LightPlayer.mime.xml /app/share/mime/packages/im.hjc.LightPlayer.xml
      # Install every icon size the source provides so shells (e.g. the KDE menu)
      # can pick the exact size they need instead of downscaling one large icon.
      - install -Dm644 packaging/flatpak/icons/16x16/im.hjc.LightPlayer.png /app/share/icons/hicolor/16x16/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/24x24/im.hjc.LightPlayer.png /app/share/icons/hicolor/24x24/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/32x32/im.hjc.LightPlayer.png /app/share/icons/hicolor/32x32/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/48x48/im.hjc.LightPlayer.png /app/share/icons/hicolor/48x48/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/64x64/im.hjc.LightPlayer.png /app/share/icons/hicolor/64x64/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/128x128/im.hjc.LightPlayer.png /app/share/icons/hicolor/128x128/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/flatpak/icons/256x256/im.hjc.LightPlayer.png /app/share/icons/hicolor/256x256/apps/im.hjc.LightPlayer.png
      - install -Dm644 packaging/icons/app-icon.svg /app/share/icons/hicolor/scalable/apps/im.hjc.LightPlayer.svg
      - install -Dm644 packaging/flatpak/icons/symbolic/im.hjc.LightPlayer-symbolic.svg /app/share/icons/hicolor/symbolic/apps/im.hjc.LightPlayer-symbolic.svg
    sources:
      - type: archive
        path: LightPlayer.tar.gz
      # Pinned offline NuGet feed generated on the host by nuget-sources.py.
      # flatpak-builder downloads the Avalonia release ZIP and the remaining .nupkg
      # files during its fetch phase, so the in-sandbox restore needs no network.
      - nuget-sources.json
      - type: file
        path: nuget.config
