<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181c20">
  <title>Light Player Web Video Validation</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Aptos", "Segoe UI", sans-serif;
      letter-spacing: 0;
      background: #181c20;
      color: #e7eaee;
    }

    html, body, #out {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      gap: 14px;
      box-sizing: border-box;
      padding: 24px;
      background-color: #181c20;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 32px 32px;
      text-align: center;
      transition: opacity .2s ease;
    }

    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #boot-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: #4cc2ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    #boot-title { font-size: 20px; font-weight: 600; }
    #boot-status { min-height: 1.4em; color: #a9b2bc; font-size: 13px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-spinner { animation-duration: 2.5s; } }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="boot" role="status" aria-live="polite">
    <div id="boot-spinner"></div>
    <div id="boot-title">Web video validation</div>
    <div id="boot-status">Loading .NET runtime</div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
