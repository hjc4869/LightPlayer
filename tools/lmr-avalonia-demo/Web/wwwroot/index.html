<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LMR Browser Player</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",sans-serif;background:#141718;color:#ecf0f0}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer{padding:10px 14px;background:#222827;display:flex;align-items:center;gap:12px;flex-wrap:wrap}strong{color:#9bddc0}button,select,input{font:inherit;color:inherit;background:#303936;border:1px solid #61756c;border-radius:4px;min-height:32px}button{padding:4px 12px}button:hover{background:#405549}#out{min-height:0;width:100%;position:relative;background:#000}#name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:100px}#seek{flex:1;min-width:140px;accent-color:#79d6ac}output{font-variant-numeric:tabular-nums;font-size:12px}#error{width:100%;color:#ffb5ac;white-space:pre-wrap}#stats{width:100%;color:#b8cdc6}input[type=file]{display:none}@media(max-width:540px){header,footer{gap:6px;padding:8px}#name{width:100%;flex-basis:100%}#stats{font-size:11px}}
</style></head>
<body><header><strong>LMR</strong><button id="open">Open</button><select id="decoder" aria-label="Decoder"><option value="auto">Automatic</option><option value="ffmpeg">FFmpeg</option><option value="webcodecs">WebCodecs</option></select><span id="name">Browser Player</span></header>
<main id="out"></main><footer><button id="play">Play</button><button id="pause">Pause</button><button id="step">Step</button><button id="stop">Stop</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Position"><output id="time">0:00</output><select id="zoom" aria-label="Photo zoom"><option value="1">Fit</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select><output id="stats">Loading</output><output id="error"></output></footer><input id="file" type="file" accept="video/*,audio/*,image/*,.heic,.heif,.avif,.mkv"><script type="module" src="main.js"></script></body></html>
